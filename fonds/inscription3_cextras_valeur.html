    </td>
    <td>
        <input type="checkbox" name="[(#VALEUR{options/nom})]_nocreation" [(#ENV{[(#VALEUR{options/nom})]_nocreation}|=={on}|oui) checked="checked)" ] id="[(#VALEUR{options/nom})]_nocreaction" />

    <td>
        <input type="checkbox" name="[(#VALEUR{options/nom})]_fiche_nocreation" [(#ENV{[(#VALEUR{options/nom})]_fiche_nocreation}|=={on}|oui)checked="checked" ] id="[(#VALEUR{options/nom})]_fiche" />

    <td>
        <input type="checkbox" name="[(#VALEUR{options/nom})]_obligatoire_nocreation" [(#ENV{[(#VALEUR{options/nom})]_obligatoire_nocreation}|=={on}|oui)checked="checked" ] id="[(#VALEUR{options/nom})]_obligatoire" />
    </td>
    ][(#VALEUR{saisie}|in_array{#LISTE{fieldset,explication}}|oui)

    <td></td>
    ]
</tr>
<BOUCLE_objets(DATA){source tableau,#VALEUR{saisies}}>
